<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расчёт доставки СВ ОКНА</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* Only the map. It always stays light, like in index.html, so the tokens have no dark variant. */
:root { --bg: #f3f4f6; --accent: #1f4fd1; color-scheme: light; }
html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
body { background: var(--bg); }
.maplibregl-canvas { cursor: crosshair; }
</style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
/* Distance is measured by road from here. It is not shown on the map. */
const BASE = { lat: 55.179161, lon: 37.398409 };

/* A click drops a pin and sends the program "lat,lon,km" through
   window.chrome.webview.postMessage (WebView2), e.g. "55.100000,37.500000,47.3".
   If there is no road route (or the routing service fails), km is 0. */
const map = new maplibregl.Map({ container: "map", style: "https://tiles.openfreemap.org/styles/liberty", center: [BASE.lon, BASE.lat], zoom: 9, attributionControl: false, dragRotate: false, pitchWithRotate: false, doubleClickZoom: false });
map.touchZoomRotate.disableRotation();
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");
map.addControl(new maplibregl.AttributionControl({ compact: true }), "bottom-left");

map.on("style.load", () => {
  // Russian labels everywhere; road shields (ref) stay as they are.
  const ru = ["coalesce", ["get", "name:ru"], ["get", "name"]];
  for (const l of map.getStyle().layers) {
    if (l.type !== "symbol") continue;
    const tf = JSON.stringify(l.layout?.["text-field"] ?? "");
    if (tf.includes("name") && !tf.includes("ref")) map.setLayoutProperty(l.id, "text-field", ru);
  }
});

const pin = new maplibregl.Marker({ color: getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() });

let seq = 0, ctrl;
map.on("click", async e => {
  const { lat, lng: lon } = e.lngLat, my = ++seq;
  pin.setLngLat([lon, lat]).addTo(map);
  let km = 0;
  try { km = await roadKm(BASE, { lat, lon }); } catch {}
  if (my !== seq) return; // a newer click owns the answer
  try { window.chrome?.webview?.postMessage(`${lat.toFixed(6)},${lon.toFixed(6)},${km ? km.toFixed(1) : 0}`); } catch {}
});

// Road distance in km, or 0 when OSRM finds no road.
async function roadKm(a, b) {
  ctrl?.abort(); ctrl = new AbortController();
  const c = ctrl, timer = setTimeout(() => c.abort(), 20000);
  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`;
    const data = await (await fetch(url, { signal: c.signal })).json();
    return data.code === "Ok" && data.routes?.length ? data.routes[0].distance / 1000 : 0;
  } finally { clearTimeout(timer); }
}
</script>
</body>
</html>
